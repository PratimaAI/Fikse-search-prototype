<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fikse Search</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f8f9fa;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .search-box {
      max-width: 600px;
      margin: 20px auto;
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 10px 16px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .results {
      max-width: 800px;
      margin: 40px auto;
    }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .score {
      float: right;
      color: #888;
    }
    .match-type {
      display: inline-block;
      background: #e9ecef;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-left: 10px;
    }
    .loading {
      text-align: center;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Fikse Search</h1>
  <div class="search-box">
    <input type="text" id="query" placeholder="Type anything (e.g. fix zipper, buttons, repair jeans)..."/>
    <button onclick="search()">Search</button>
  </div>
  <div class="results" id="results"></div>

  <script>
    let datasetConfig = null;
    let columnDisplayNames = {};

    // Load dataset configuration on page load
    async function loadDatasetConfig() {
      try {
        const response = await fetch('/dataset-config');
        const config = await response.json();
        datasetConfig = config;
        
        // Create display names for columns
        columnDisplayNames = {
          'business_type': 'Business Type',
          'category': 'Category', 
          'item_name': 'Item Name',
          'service_name': 'Service Name',
          'service_type': 'Service Type',
          'description': 'Description',
          'price': 'Price',
          'hours': 'Hours'
        };
        
        console.log('Dataset configuration loaded:', config);
      } catch (error) {
        console.error('Failed to load dataset config:', error);
        // Fallback to default configuration
        datasetConfig = {
          standard_columns: ['business_type', 'category', 'item_name', 'service_name', 'service_type', 'description', 'price', 'hours']
        };
      }
    }

    // Format column name for display
    function formatColumnName(columnName) {
      return columnDisplayNames[columnName] || columnName.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    }

    // Get value safely with fallback
    function getValue(item, columnName) {
      return item[columnName] || item[columnName.toLowerCase()] || "N/A";
    }

    async function search() {
      const query = document.getElementById("query").value;
      const container = document.getElementById("results");
      
      // Show loading
      container.innerHTML = '<div class="loading">Searching...</div>';
      
      try {
        const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
        const data = await response.json();

        container.innerHTML = "";

        if (data.length === 0) {
          container.innerHTML = "<p>No results found.</p>";
          return;
        }

        // Get standard columns from config or use default
        const standardColumns = datasetConfig?.standard_columns || [
          'business_type', 'category', 'item_name', 'service_name', 
          'service_type', 'description', 'price', 'hours'
        ];

        data.forEach(item => {
          const card = document.createElement("div");
          card.className = "card";
          
          // Build HTML dynamically based on available columns
          let htmlContent = '';
          
          standardColumns.forEach(column => {
            const displayName = formatColumnName(column);
            const value = getValue(item, column);
            htmlContent += `<strong>${displayName}:</strong> ${value}<br/>`;
          });
          
          // Add score and match type
          htmlContent += `
            <span class="score">Score: ${item["similarity_score"]?.toFixed(2) || "N/A"}</span>
            <span class="match-type">${item["match_type"] || "N/A"}</span>
          `;
          
          card.innerHTML = htmlContent;
          container.appendChild(card);
        });
      } catch (error) {
        console.error('Search error:', error);
        container.innerHTML = '<p>Error performing search. Please try again.</p>';
      }
    }

    // Load configuration when page loads
    window.onload = loadDatasetConfig;
  </script>
</body>
</html>
